[build]
  command = "node build.js"
  publish = "dist"

# Clean URLs: /reviews/nightbitch/ serves reviews/nightbitch/index.html
[[redirects]]
  from = "/reviews/:slug"
  to = "/reviews/:slug/index.html"
  status = 200

[[redirects]]
  from = "/category/:slug"
  to = "/category/:slug/index.html"
  status = 200

# Cache static assets aggressively
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# 404 error page
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

# Block admin from search engines
[[headers]]
  for = "/gracie/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# TikTok demo proxy
[[redirects]]
  from = "/tiktok/*"
  to = "https://slot-alliance-oct-alternatives.trycloudflare.com/tiktok/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/tiktok"
  to = "https://slot-alliance-oct-alternatives.trycloudflare.com/"
  status = 200
  force = true
