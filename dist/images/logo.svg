<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 520" width="600" height="520">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#d4a23a;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#f0c45a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#b8862d;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="flameGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#d4a23a;stop-opacity:1" />
      <stop offset="40%" style="stop-color:#f0a030;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff6600;stop-opacity:0.9" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2a2a35;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a24;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="wingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#c0993a;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#a07828;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8a6820;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="rayGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#f0c45a;stop-opacity:0.6"/>
      <stop offset="100%" style="stop-color:#f0c45a;stop-opacity:0"/>
    </radialGradient>
  </defs>

  <!-- Left Wing -->
  <g transform="translate(300, 220)">
    <!-- Left wing feathers -->
    <path d="M-60,0 C-100,-20 -180,-60 -230,-30 C-200,-50 -160,-55 -60,-10Z" fill="url(#wingGrad)" opacity="0.9"/>
    <path d="M-55,10 C-100,0 -190,-30 -240,-5 C-210,-25 -170,-30 -55,0Z" fill="url(#wingGrad)" opacity="0.85"/>
    <path d="M-50,20 C-95,15 -185,-5 -245,15 C-215,0 -175,-5 -50,12Z" fill="url(#wingGrad)" opacity="0.8"/>
    <path d="M-45,30 C-90,28 -170,15 -235,35 C-205,22 -170,18 -45,22Z" fill="url(#wingGrad)" opacity="0.75"/>
    <path d="M-40,40 C-85,40 -155,35 -215,50 C-190,40 -160,36 -40,32Z" fill="url(#wingGrad)" opacity="0.7"/>
    <!-- Wing highlight -->
    <path d="M-60,0 C-80,-10 -120,-25 -160,-20 C-130,-30 -90,-20 -60,-5Z" fill="#f0c45a" opacity="0.3"/>
  </g>
  <!-- Right Wing -->
  <g transform="translate(300, 220)">
    <path d="M60,0 C100,-20 180,-60 230,-30 C200,-50 160,-55 60,-10Z" fill="url(#wingGrad)" opacity="0.9"/>
    <path d="M55,10 C100,0 190,-30 240,-5 C210,-25 170,-30 55,0Z" fill="url(#wingGrad)" opacity="0.85"/>
    <path d="M50,20 C95,15 185,-5 245,15 C215,0 175,-5 50,12Z" fill="url(#wingGrad)" opacity="0.8"/>
    <path d="M45,30 C90,28 170,15 235,35 C205,22 170,18 45,22Z" fill="url(#wingGrad)" opacity="0.75"/>
    <path d="M40,40 C85,40 155,35 215,50 C190,40 160,36 40,32Z" fill="url(#wingGrad)" opacity="0.7"/>
    <path d="M60,0 C80,-10 120,-25 160,-20 C130,-30 90,-20 60,-5Z" fill="#f0c45a" opacity="0.3"/>
  </g>

  <!-- Shield -->
  <path d="M300,100 L380,140 L380,280 L300,340 L220,280 L220,140 Z" fill="url(#shieldGrad)" stroke="url(#goldGrad)" stroke-width="3"/>
  <!-- Shield inner border -->
  <path d="M300,112 L372,148 L372,274 L300,330 L228,274 L228,148 Z" fill="none" stroke="url(#goldGrad)" stroke-width="1" opacity="0.5"/>

  <!-- Rays behind flame -->
  <g filter="url(#glow)" opacity="0.4">
    <line x1="300" y1="95" x2="300" y2="45" stroke="#f0c45a" stroke-width="2"/>
    <line x1="300" y1="95" x2="270" y2="50" stroke="#f0c45a" stroke-width="1.5"/>
    <line x1="300" y1="95" x2="330" y2="50" stroke="#f0c45a" stroke-width="1.5"/>
    <line x1="300" y1="95" x2="250" y2="60" stroke="#f0c45a" stroke-width="1"/>
    <line x1="300" y1="95" x2="350" y2="60" stroke="#f0c45a" stroke-width="1"/>
    <line x1="300" y1="95" x2="240" y2="75" stroke="#f0c45a" stroke-width="0.8"/>
    <line x1="300" y1="95" x2="360" y2="75" stroke="#f0c45a" stroke-width="0.8"/>
  </g>

  <!-- Torch stem -->
  <rect x="295" y="110" width="10" height="30" fill="url(#goldGrad)" rx="2"/>
  <!-- Torch cup -->
  <path d="M285,112 L290,100 L310,100 L315,112 Z" fill="url(#goldGrad)"/>
  <!-- Flame -->
  <path d="M300,100 C295,85 288,75 290,60 C292,50 298,45 300,35 C302,45 308,50 310,60 C312,75 305,85 300,100Z" fill="url(#flameGrad)" filter="url(#glow)"/>
  <!-- Inner flame -->
  <path d="M300,98 C298,88 294,80 296,70 C297,62 299,58 300,50 C301,58 303,62 304,70 C306,80 302,88 300,98Z" fill="#ffe080" opacity="0.7"/>

  <!-- Eye -->
  <g transform="translate(300, 195)">
    <!-- Eye outer -->
    <ellipse cx="0" cy="0" rx="28" ry="16" fill="none" stroke="url(#goldGrad)" stroke-width="2"/>
    <!-- Iris -->
    <circle cx="0" cy="0" r="10" fill="url(#goldGrad)" opacity="0.8"/>
    <!-- Pupil -->
    <circle cx="0" cy="0" r="5" fill="#1a1a24"/>
    <!-- Highlight -->
    <circle cx="3" cy="-3" r="2" fill="#fff" opacity="0.7"/>
    <!-- Eye glow -->
    <ellipse cx="0" cy="0" rx="28" ry="16" fill="none" stroke="#f0c45a" stroke-width="1" opacity="0.3" filter="url(#glow)"/>
  </g>

  <!-- Open Book -->
  <g transform="translate(300, 275)">
    <!-- Left page -->
    <path d="M-5,-15 L-35,-10 L-35,15 L-5,10 Z" fill="#d4d0c8" stroke="url(#goldGrad)" stroke-width="1"/>
    <!-- Right page -->
    <path d="M5,-15 L35,-10 L35,15 L5,10 Z" fill="#e8e4dc" stroke="url(#goldGrad)" stroke-width="1"/>
    <!-- Spine -->
    <line x1="0" y1="-16" x2="0" y2="11" stroke="url(#goldGrad)" stroke-width="2"/>
    <!-- Text lines left -->
    <line x1="-30" y1="-5" x2="-10" y2="-8" stroke="#999" stroke-width="0.5" opacity="0.5"/>
    <line x1="-30" y1="0" x2="-10" y2="-3" stroke="#999" stroke-width="0.5" opacity="0.5"/>
    <line x1="-30" y1="5" x2="-10" y2="2" stroke="#999" stroke-width="0.5" opacity="0.5"/>
    <!-- Text lines right -->
    <line x1="10" y1="-8" x2="30" y2="-5" stroke="#999" stroke-width="0.5" opacity="0.5"/>
    <line x1="10" y1="-3" x2="30" y2="0" stroke="#999" stroke-width="0.5" opacity="0.5"/>
    <line x1="10" y1="2" x2="30" y2="5" stroke="#999" stroke-width="0.5" opacity="0.5"/>
  </g>

  <!-- Star -->
  <polygon points="300,355 303,363 312,363 305,369 308,377 300,372 292,377 295,369 288,363 297,363" fill="url(#goldGrad)" opacity="0.8"/>

  <!-- VIRTUEVIGIL Text -->
  <text x="300" y="410" text-anchor="middle" font-family="'Cinzel', 'Times New Roman', serif" font-weight="700" font-size="46" letter-spacing="6">
    <tspan fill="#c0993a">V</tspan><tspan fill="#a8a8a8">IRTUE</tspan><tspan fill="#c0993a">V</tspan><tspan fill="#a8a8a8">IGIL</tspan>
  </text>

  <!-- Decorative lines around tagline -->
  <line x1="140" y1="430" x2="260" y2="430" stroke="url(#goldGrad)" stroke-width="1" opacity="0.6"/>
  <line x1="340" y1="430" x2="460" y2="430" stroke="url(#goldGrad)" stroke-width="1" opacity="0.6"/>

  <!-- Tagline -->
  <text x="300" y="450" text-anchor="middle" font-family="'Cinzel', 'Times New Roman', serif" font-weight="400" font-size="16" fill="#c0993a" letter-spacing="3">
    Guarding Values. Exposing Agendas.
  </text>
</svg>