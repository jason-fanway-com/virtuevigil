<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VirtueVigil x TikTok Integration</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #1a1a2e; color: #e0e0e0; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .container { max-width: 560px; width: 100%; padding: 40px 24px; text-align: center; }
    h1 { font-size: 28px; font-weight: 700; margin-bottom: 8px; color: #fff; }
    h1 span { color: #fe2c55; }
    .subtitle { color: #888; font-size: 14px; margin-bottom: 40px; }
    .card { background: #16213e; border: 1px solid #2a2a4a; border-radius: 12px; padding: 32px 24px; margin-bottom: 20px; }
    .status-dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 8px; vertical-align: middle; }
    .status-dot.disconnected { background: #666; }
    .status-dot.connected { background: #25d366; }
    .status-text { font-size: 15px; margin-bottom: 24px; }
    .btn { display: inline-block; padding: 14px 32px; border: none; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; transition: opacity 0.2s; text-decoration: none; color: #fff; background: #fe2c55; }
    .btn:hover { opacity: 0.85; }
    .success { color: #25d366; font-size: 18px; font-weight: 600; margin-bottom: 12px; }
    .detail { color: #aaa; font-size: 13px; font-family: monospace; }
    .footer { margin-top: 40px; color: #555; font-size: 12px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>VirtueVigil <span>x</span> TikTok</h1>
    <p class="subtitle">Content Posting Integration Demo</p>
    <div class="card" id="main-card">
      <p class="status-text">
        <span class="status-dot" id="status-dot"></span>
        <span id="status-label"></span>
      </p>
      <div id="action-area"></div>
    </div>
    <p class="footer">virtuevigil.com &mdash; App Review Demo</p>
  </div>
  <script>
    const params = new URLSearchParams(window.location.search);
    const connected = params.get('connected');
    const error = params.get('error');
    const openId = params.get('open_id');
    const tokenPreview = params.get('token_preview');
    const dot = document.getElementById('status-dot');
    const label = document.getElementById('status-label');
    const area = document.getElementById('action-area');

    if (connected) {
      dot.className = 'status-dot connected';
      label.textContent = 'Connected to TikTok';
      area.innerHTML = '<p class="success">Authorization successful!</p>' +
        '<p class="detail">Open ID: ' + openId + '</p>' +
        '<p class="detail" style="margin-top:8px">Access token received: ' + tokenPreview + '...</p>';
    } else if (error) {
      dot.className = 'status-dot disconnected';
      label.textContent = 'Authorization failed: ' + error;
      area.innerHTML = '<a href="/tiktok/authorize" class="btn">Try Again</a>';
    } else {
      dot.className = 'status-dot disconnected';
      label.textContent = 'Not connected';
      area.innerHTML = '<a href="/tiktok/authorize" class="btn">Connect TikTok Account</a>';
    }
  </script>
</body>
</html>
