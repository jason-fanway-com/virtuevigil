<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VirtueVigil x TikTok Integration</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1a1a2e;
      color: #e0e0e0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .container {
      max-width: 560px;
      width: 100%;
      padding: 40px 24px;
      text-align: center;
    }
    h1 {
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 8px;
      color: #fff;
    }
    h1 span { color: #fe2c55; }
    .subtitle {
      color: #888;
      font-size: 14px;
      margin-bottom: 40px;
    }
    .card {
      background: #16213e;
      border: 1px solid #2a2a4a;
      border-radius: 12px;
      padding: 32px 24px;
      margin-bottom: 20px;
    }
    .status-dot {
      display: inline-block;
      width: 10px; height: 10px;
      border-radius: 50%;
      margin-right: 8px;
      vertical-align: middle;
    }
    .status-dot.disconnected { background: #666; }
    .status-dot.connected { background: #25d366; }
    .status-text {
      font-size: 15px;
      margin-bottom: 24px;
    }
    .user-info {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 24px;
      text-align: left;
    }
    .user-info img {
      width: 56px; height: 56px;
      border-radius: 50%;
      border: 2px solid #fe2c55;
    }
    .user-info .name { font-weight: 600; font-size: 16px; color: #fff; }
    .user-info .handle { color: #888; font-size: 13px; }
    .btn {
      display: inline-block;
      padding: 14px 32px;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
      text-decoration: none;
    }
    .btn:hover { opacity: 0.85; }
    .btn-primary {
      background: #fe2c55;
      color: #fff;
    }
    .btn-secondary {
      background: #2a2a4a;
      color: #e0e0e0;
      margin-top: 12px;
    }
    .btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }
    .result-box {
      margin-top: 20px;
      background: #0f0f23;
      border: 1px solid #2a2a4a;
      border-radius: 8px;
      padding: 16px;
      font-family: 'SF Mono', Monaco, monospace;
      font-size: 12px;
      color: #aaa;
      text-align: left;
      white-space: pre-wrap;
      word-break: break-all;
      display: none;
    }
    .footer {
      margin-top: 40px;
      color: #555;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>VirtueVigil <span>x</span> TikTok</h1>
    <p class="subtitle">Content Posting Integration Demo</p>

    <div class="card" id="auth-card">
      <p class="status-text">
        <span class="status-dot disconnected" id="status-dot"></span>
        <span id="status-label">Not connected</span>
      </p>
      <div id="user-info" style="display:none;" class="user-info">
        <img id="user-avatar" src="" alt="avatar">
        <div>
          <div class="name" id="user-name"></div>
          <div class="handle" id="user-handle"></div>
        </div>
      </div>
      <a href="/tiktok/authorize" class="btn btn-primary" id="connect-btn">Connect TikTok Account</a>
    </div>

    <div class="card" id="post-card" style="display:none;">
      <p style="margin-bottom:16px; font-size:15px;">Upload a test video to your TikTok inbox</p>
      <button class="btn btn-primary" id="post-btn" onclick="postVideo()">Post Test Video</button>
      <div class="result-box" id="result-box"></div>
    </div>

    <p class="footer">virtuevigil.com &mdash; App Review Demo</p>
  </div>

  <script>
    async function checkStatus() {
      try {
        const res = await fetch('/tiktok/status');
        const data = await res.json();
        if (data.connected) {
          document.getElementById('status-dot').className = 'status-dot connected';
          document.getElementById('status-label').textContent = 'Connected';
          document.getElementById('connect-btn').style.display = 'none';
          document.getElementById('post-card').style.display = 'block';
          if (data.user) {
            const info = document.getElementById('user-info');
            info.style.display = 'flex';
            document.getElementById('user-avatar').src = data.user.avatar_url || '';
            document.getElementById('user-name').textContent = data.user.display_name || 'TikTok User';
            document.getElementById('user-handle').textContent = '@' + (data.user.username || '');
            if (!data.user.avatar_url) {
              document.getElementById('user-avatar').style.display = 'none';
            }
          }
        }
      } catch (e) {
        console.error('Status check failed', e);
      }
    }

    async function postVideo() {
      const btn = document.getElementById('post-btn');
      const box = document.getElementById('result-box');
      btn.disabled = true;
      btn.textContent = 'Uploading...';
      box.style.display = 'block';
      box.textContent = 'Initiating upload...\n';
      try {
        const res = await fetch('/tiktok/post', { method: 'POST' });
        const data = await res.json();
        if (data.success) {
          box.textContent += 'Upload initiated successfully!\n\n';
          box.textContent += 'Publish ID: ' + (data.publish_id || 'N/A') + '\n';
          box.textContent += 'Upload URL provided: ' + (data.upload_url ? 'Yes' : 'No') + '\n\n';
          box.textContent += 'The video has been sent to your TikTok inbox for review.';
        } else {
          box.textContent += 'Error: ' + (data.error || 'Unknown error') + '\n';
          if (data.details) box.textContent += JSON.stringify(data.details, null, 2);
        }
      } catch (e) {
        box.textContent += 'Request failed: ' + e.message;
      }
      btn.disabled = false;
      btn.textContent = 'Post Test Video';
    }

    checkStatus();
  </script>
</body>
</html>
